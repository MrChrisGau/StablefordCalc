name: Supabase Keep-Alive

on:
  schedule:
    # Every Monday at 06:00 UTC — well within Supabase's 7-day free-tier
    # inactivity window, so the project never gets auto-paused.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase to register activity
        run: |
          curl --fail --silent --show-error \
            "${SUPABASE_URL}/rest/v1/courses?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
